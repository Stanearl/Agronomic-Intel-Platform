services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dfdst-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8087"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL}
    container_name: dfdst-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "8086"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: dfdst-caddy
    restart: unless-stopped
    # Ports 80/443 are already bound by another site on this host. Caddy
    # publishes directly on this project's existing convention ports
    # (8086 = frontend, 8087 = backend — matching vite.config.js and the
    # Dockerfiles). TLS certificates are issued via Cloudflare DNS-01 (see
    # Caddyfile), so port 80 reachability is never required.
    ports:
      - "8086:8086"
      - "8087:8087"

    env_file:
      - ./caddy.env
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - internal


networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
